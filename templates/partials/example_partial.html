<div id="partial-example" class="space-y-4">
    <form action="/api/example/partial" method="get" hx-get="/api/example/partial" hx-target="#partial-example" hx-swap="outerHTML">
        <input type="hidden" name="counter" value="{{ next_counter }}">
        <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Load partial content</button>
    </form>
<div id="partial-content" aria-live="polite" class="bg-blue-50 border border-blue-200 rounded-lg p-6">
    <h3 class="text-xl font-semibold text-blue-900 mb-2">Partial Content Loaded</h3>
    <p class="text-blue-700 mb-2">
        <strong>Counter:</strong> {{ counter }}
    </p>
    <p class="text-blue-700 mb-4">{{ message }}</p>
    <p class="text-sm text-blue-600">
        This content was loaded via HTMX without refreshing the entire page. 
        The counter increments each time you click the button.
    </p>
</div>
</div>
