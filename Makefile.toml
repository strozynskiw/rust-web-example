# Optional cargo-make shortcuts. Plain Cargo commands remain the primary interface.
[config]
default_to_workspace = false

[tasks.run]
description = "Run from the repository root (SQLite by default)"
command = "cargo"
args = ["run", "--locked", "--bin", "web-template"]

[tasks.dev]
alias = "run"

[tasks.build]
command = "cargo"
args = ["build", "--workspace", "--locked"]

[tasks.build-release]
command = "cargo"
args = ["build", "--workspace", "--release", "--locked"]

[tasks.check]
command = "cargo"
args = ["check", "--workspace", "--locked"]

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-check]
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--locked", "--", "-D", "warnings"]

[tasks.test]
command = "cargo"
args = ["test", "--workspace", "--locked"]

[tasks.test-postgres]
description = "Requires TEST_DATABASE_URL pointing at an EMPTY disposable database"
command = "cargo"
args = ["test", "--locked", "--bin", "web-template", "postgres_storage_contract", "--", "--ignored"]

[tasks.assets]
command = "npm"
args = ["run", "build"]

[tasks.test-browser]
command = "npm"
args = ["run", "test:e2e"]

[tasks.db-setup]
description = "Requires a unique POSTGRES_PASSWORD in .env"
command = "docker"
args = ["compose", "up", "-d", "postgres"]

[tasks.db-stop]
command = "docker"
args = ["compose", "down"]

[tasks.db-logs]
command = "docker"
args = ["compose", "logs", "-f", "postgres"]

[tasks.create-admin]
description = "cargo make create-admin USERNAME EMAIL (hidden password prompt)"
command = "cargo"
args = ["run", "--locked", "--bin", "create_admin", "--", "${@}"]

[tasks.create-user]
description = "cargo make create-user USERNAME EMAIL (explicit regular-user role)"
command = "cargo"
args = ["run", "--locked", "--bin", "create_admin", "--", "${@}", "user"]

[tasks.docker-build]
command = "docker"
args = ["build", "-t", "web-template:latest", "."]

[tasks.docker-run]
description = "Local HTTP demo with persistent SQLite; production requires HTTPS APP_ORIGIN"
command = "docker"
args = ["run", "--rm", "-p", "127.0.0.1:3000:3000", "-v", "web-template-data:/data", "-e", "APP_ORIGIN=http://localhost:3000", "--name", "web-template", "web-template:latest"]

[tasks.ci]
dependencies = ["fmt-check", "clippy", "test", "build"]

[tasks.ci-full]
dependencies = ["ci", "build-release", "test-browser"]

[tasks.default]
command = "cargo"
args = ["make", "--list-all-steps"]
